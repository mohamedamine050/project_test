name: CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - '.env.example'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Set SHA
        run: echo "GIT_SHA=40a57b04cc5bfebc9f49f04e28e43e88bbe972ad" >> $GITHUB_ENV

      - name: Build dependencies
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build/
          cd build
          zip -r ../dependencies.zip .

      - name: Upload dependencies
        run: |
          aws s3 cp dependencies.zip s3://bucket/libs/dependencies-${GIT_SHA}.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Get Terraform outputs
        run: |
          echo "S3_BUCKET_1=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_1=$(terraform output -raw glue_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_1=$(terraform output -raw glue_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_2=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_2=$(terraform output -raw glue_second_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_2=$(terraform output -raw glue_second_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_3=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_3=$(terraform output -raw glue_third_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_3=$(terraform output -raw glue_third_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_4=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_4=$(terraform output -raw glue_fourth_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_4=$(terraform output -raw glue_fourth_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_5=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_5=$(terraform output -raw glue_fifth_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_5=$(terraform output -raw glue_fifth_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_6=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_6=$(terraform output -raw glue_sixth_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_6=$(terraform output -raw glue_sixth_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_7=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_7=$(terraform output -raw glue_seventh_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_7=$(terraform output -raw glue_seventh_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_8=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_8=$(terraform output -raw glue_eighth_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_8=$(terraform output -raw glue_eighth_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_9=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_9=$(terraform output -raw glue_ninth_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_9=$(terraform output -raw glue_ninth_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_10=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_10=$(terraform output -raw glue_tenth_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_10=$(terraform output -raw glue_tenth_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_11=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_11=$(terraform output -raw glue_eleventh_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_11=$(terraform output -raw glue_eleventh_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_12=$(terraform output -raw output_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY_12=$(terraform output -raw glue_twelfth_job_name)" >> $GITHUB_ENV
          echo "GLUE_JOB_12=$(terraform output -raw glue_twelfth_job_name)" >> $GITHUB_ENV


      - name: Build S3 path
        run: |
          echo "S3_PATH_1=s3://$S3_BUCKET_1/$S3_KEY_1" >> $GITHUB_ENV

          echo "S3_PATH_2=s3://$S3_BUCKET_2/$S3_KEY_2" >> $GITHUB_ENV

          echo "S3_PATH_3=s3://$S3_BUCKET_3/$S3_KEY_3" >> $GITHUB_ENV

          echo "S3_PATH_4=s3://$S3_BUCKET_4/$S3_KEY_4" >> $GITHUB_ENV

          echo "S3_PATH_5=s3://$S3_BUCKET_5/$S3_KEY_5" >> $GITHUB_ENV

          echo "S3_PATH_6=s3://$S3_BUCKET_6/$S3_KEY_6" >> $GITHUB_ENV

          echo "S3_PATH_7=s3://$S3_BUCKET_7/$S3_KEY_7" >> $GITHUB_ENV

          echo "S3_PATH_8=s3://$S3_BUCKET_8/$S3_KEY_8" >> $GITHUB_ENV

          echo "S3_PATH_9=s3://$S3_BUCKET_9/$S3_KEY_9" >> $GITHUB_ENV

          echo "S3_PATH_10=s3://$S3_BUCKET_10/$S3_KEY_10" >> $GITHUB_ENV

          echo "S3_PATH_11=s3://$S3_BUCKET_11/$S3_KEY_11" >> $GITHUB_ENV

          echo "S3_PATH_12=s3://$S3_BUCKET_12/$S3_KEY_12" >> $GITHUB_ENV


      - name: Backup Current Glue Scripts
        run: |
          set -euo pipefail
          mkdir -p .backups
          echo "[INFO] Backing up current Glue scripts before deployment..."
          aws s3 cp s3://$S3_BUCKET_1/$S3_KEY_1 .backups/glue_job_1_backup.py 2>/dev/null || echo "[WARN] No current script for job 1"
          aws s3 cp s3://$S3_BUCKET_2/$S3_KEY_2 .backups/glue_job_2_backup.py 2>/dev/null || echo "[WARN] No current script for job 2"
          aws s3 cp s3://$S3_BUCKET_3/$S3_KEY_3 .backups/glue_job_3_backup.py 2>/dev/null || echo "[WARN] No current script for job 3"
          aws s3 cp s3://$S3_BUCKET_4/$S3_KEY_4 .backups/glue_job_4_backup.py 2>/dev/null || echo "[WARN] No current script for job 4"
          aws s3 cp s3://$S3_BUCKET_5/$S3_KEY_5 .backups/glue_job_5_backup.py 2>/dev/null || echo "[WARN] No current script for job 5"
          aws s3 cp s3://$S3_BUCKET_6/$S3_KEY_6 .backups/glue_job_6_backup.py 2>/dev/null || echo "[WARN] No current script for job 6"
          aws s3 cp s3://$S3_BUCKET_7/$S3_KEY_7 .backups/glue_job_7_backup.py 2>/dev/null || echo "[WARN] No current script for job 7"
          aws s3 cp s3://$S3_BUCKET_8/$S3_KEY_8 .backups/glue_job_8_backup.py 2>/dev/null || echo "[WARN] No current script for job 8"
          aws s3 cp s3://$S3_BUCKET_9/$S3_KEY_9 .backups/glue_job_9_backup.py 2>/dev/null || echo "[WARN] No current script for job 9"
          aws s3 cp s3://$S3_BUCKET_10/$S3_KEY_10 .backups/glue_job_10_backup.py 2>/dev/null || echo "[WARN] No current script for job 10"
          aws s3 cp s3://$S3_BUCKET_11/$S3_KEY_11 .backups/glue_job_11_backup.py 2>/dev/null || echo "[WARN] No current script for job 11"
          aws s3 cp s3://$S3_BUCKET_12/$S3_KEY_12 .backups/glue_job_12_backup.py 2>/dev/null || echo "[WARN] No current script for job 12"
          echo "[✓] Backup completed"

      - name: Replace Glue script in S3
        run: |
          aws s3 cp frontend/src/jobs/LETING.py $S3_PATH_1
          aws s3 cp frontend/src/jobs/data_ming.py $S3_PATH_2
          aws s3 cp frontend/src/jobs/etl_offers.py $S3_PATH_3
          aws s3 cp frontend/src/jobs/etl_sales.py $S3_PATH_4
          aws s3 cp frontend/src/jobs/etl_sports $S3_PATH_5
          aws s3 cp frontend/src/jobs/glue_users.py $S3_PATH_6
          aws s3 cp frontend/src/jobs/john.py $S3_PATH_7
          aws s3 cp frontend/src/jobs/make.py $S3_PATH_8
          aws s3 cp frontend/src/jobs/peouo.py $S3_PATH_9
          aws s3 cp frontend/src/jobs/tele.py $S3_PATH_10
          aws s3 cp frontend/src/jobs/test.py $S3_PATH_11
          aws s3 cp frontend/src/jobs/transform.py $S3_PATH_12

      # ─────────────────────────────
      # 10. Trigger Glue Jobs + capturer les Run IDs
      # FIX: on récupère les RUN_ID pour que le smoke test surveille
      #      ces runs précis, sans relancer les jobs une 2ème fois
      # ─────────────────────────────
      - name: Trigger Glue Jobs
        run: |
          RUN1=$(aws glue start-job-run --job-name "$GLUE_JOB_1" --query 'JobRunId' --output text)
          echo "RUN_ID_1=$RUN1" >> $GITHUB_ENV

          RUN2=$(aws glue start-job-run --job-name "$GLUE_JOB_2" --query 'JobRunId' --output text)
          echo "RUN_ID_2=$RUN2" >> $GITHUB_ENV

          RUN3=$(aws glue start-job-run --job-name "$GLUE_JOB_3" --query 'JobRunId' --output text)
          echo "RUN_ID_3=$RUN3" >> $GITHUB_ENV

          RUN4=$(aws glue start-job-run --job-name "$GLUE_JOB_4" --query 'JobRunId' --output text)
          echo "RUN_ID_4=$RUN4" >> $GITHUB_ENV

          RUN5=$(aws glue start-job-run --job-name "$GLUE_JOB_5" --query 'JobRunId' --output text)
          echo "RUN_ID_5=$RUN5" >> $GITHUB_ENV

          RUN6=$(aws glue start-job-run --job-name "$GLUE_JOB_6" --query 'JobRunId' --output text)
          echo "RUN_ID_6=$RUN6" >> $GITHUB_ENV

          RUN7=$(aws glue start-job-run --job-name "$GLUE_JOB_7" --query 'JobRunId' --output text)
          echo "RUN_ID_7=$RUN7" >> $GITHUB_ENV

          RUN8=$(aws glue start-job-run --job-name "$GLUE_JOB_8" --query 'JobRunId' --output text)
          echo "RUN_ID_8=$RUN8" >> $GITHUB_ENV

          RUN9=$(aws glue start-job-run --job-name "$GLUE_JOB_9" --query 'JobRunId' --output text)
          echo "RUN_ID_9=$RUN9" >> $GITHUB_ENV

          RUN10=$(aws glue start-job-run --job-name "$GLUE_JOB_10" --query 'JobRunId' --output text)
          echo "RUN_ID_10=$RUN10" >> $GITHUB_ENV

          RUN11=$(aws glue start-job-run --job-name "$GLUE_JOB_11" --query 'JobRunId' --output text)
          echo "RUN_ID_11=$RUN11" >> $GITHUB_ENV

          RUN12=$(aws glue start-job-run --job-name "$GLUE_JOB_12" --query 'JobRunId' --output text)
          echo "RUN_ID_12=$RUN12" >> $GITHUB_ENV

          echo "Jobs lancés : $RUN1 | $RUN2 | $RUN3 | $RUN4 | $RUN5 | $RUN6 | $RUN7 | $RUN8 | $RUN9 | $RUN10 | $RUN11 | $RUN12"

      # ─────────────────────────────
      # 11. SMOKE TEST
      # FIX 1: surveille les runs existants (RUN_ID) → plus de double lancement
      # FIX 2: polling en parallèle (background) → tous les jobs checkés en même temps
      # ─────────────────────────────
      - name: Smoke Test - Validate Glue Jobs
        run: |
          set -euo pipefail

          MAX_RETRIES=25
          SLEEP_TIME=25

          # Surveille un run déjà lancé (RUN_ID passé en argument)
          # FIX : prend JOB_NAME + RUN_ID existant, ne relance PAS le job
          watch_run() {
            local JOB_NAME=$1
            local RUN_ID=$2

            echo "▶ Watching [$JOB_NAME] run: $RUN_ID"

            local STATUS="STARTING"
            local COUNT=0

            while [[ "$STATUS" == "STARTING" || "$STATUS" == "RUNNING" ]]; do
              STATUS=$(aws glue get-job-run \
                --job-name "$JOB_NAME" \
                --run-id "$RUN_ID" \
                --query 'JobRun.JobRunState' \
                --output text)

              echo "  [$JOB_NAME] → $STATUS"

              COUNT=$((COUNT + 1))
              if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                echo "❌ TIMEOUT: $JOB_NAME ($RUN_ID)"
                return 1
              fi

              sleep "$SLEEP_TIME"
            done

            if [ "$STATUS" != "SUCCEEDED" ]; then
              echo "❌ FAILED: $JOB_NAME ($RUN_ID) — état final: $STATUS"
              return 1
            fi

            echo "✅ PASSED: $JOB_NAME"
            return 0
          }

          watch_run "$GLUE_JOB_1" "$RUN_ID_1" &
          watch_run "$GLUE_JOB_2" "$RUN_ID_2" &
          watch_run "$GLUE_JOB_3" "$RUN_ID_3" &
          watch_run "$GLUE_JOB_4" "$RUN_ID_4" &
          watch_run "$GLUE_JOB_5" "$RUN_ID_5" &
          watch_run "$GLUE_JOB_6" "$RUN_ID_6" &
          watch_run "$GLUE_JOB_7" "$RUN_ID_7" &
          watch_run "$GLUE_JOB_8" "$RUN_ID_8" &
          watch_run "$GLUE_JOB_9" "$RUN_ID_9" &
          watch_run "$GLUE_JOB_10" "$RUN_ID_10" &
          watch_run "$GLUE_JOB_11" "$RUN_ID_11" &
          watch_run "$GLUE_JOB_12" "$RUN_ID_12" &

          # Attendre tous les processus et échouer si l'un d'eux échoue
          FAILED=0
          for pid in $(jobs -p); do
            wait "$pid" || FAILED=1
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ Un ou plusieurs jobs Glue ont échoué."
            exit 1
          fi

          echo ""
          echo "✅ Tous les smoke tests sont passés."

      # ─────────────────────────────
      # 12. ROLLBACK ON FAILURE
      # Restore the backed up scripts from .backups/
      # ─────────────────────────────
      - name: Rollback - Restore Backups
        if: failure()
        run: |
          set -euo pipefail
          echo ""
          echo "🔴 SMOKE TEST FAILED - INITIATING ROLLBACK"
          echo ""
          echo "[ROLLBACK 1] Restoring old script for $GLUE_JOB_1..."
          aws s3 cp .backups/glue_job_1_backup.py s3://$S3_BUCKET_1/$S3_KEY_1 || echo "[WARN] Could not restore backup for job 1"
          echo "[ROLLBACK 1] Restarting $GLUE_JOB_1 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_1 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 1 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 1"; fi

          echo "[ROLLBACK 2] Restoring old script for $GLUE_JOB_2..."
          aws s3 cp .backups/glue_job_2_backup.py s3://$S3_BUCKET_2/$S3_KEY_2 || echo "[WARN] Could not restore backup for job 2"
          echo "[ROLLBACK 2] Restarting $GLUE_JOB_2 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_2 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 2 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 2"; fi

          echo "[ROLLBACK 3] Restoring old script for $GLUE_JOB_3..."
          aws s3 cp .backups/glue_job_3_backup.py s3://$S3_BUCKET_3/$S3_KEY_3 || echo "[WARN] Could not restore backup for job 3"
          echo "[ROLLBACK 3] Restarting $GLUE_JOB_3 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_3 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 3 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 3"; fi

          echo "[ROLLBACK 4] Restoring old script for $GLUE_JOB_4..."
          aws s3 cp .backups/glue_job_4_backup.py s3://$S3_BUCKET_4/$S3_KEY_4 || echo "[WARN] Could not restore backup for job 4"
          echo "[ROLLBACK 4] Restarting $GLUE_JOB_4 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_4 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 4 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 4"; fi

          echo "[ROLLBACK 5] Restoring old script for $GLUE_JOB_5..."
          aws s3 cp .backups/glue_job_5_backup.py s3://$S3_BUCKET_5/$S3_KEY_5 || echo "[WARN] Could not restore backup for job 5"
          echo "[ROLLBACK 5] Restarting $GLUE_JOB_5 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_5 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 5 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 5"; fi

          echo "[ROLLBACK 6] Restoring old script for $GLUE_JOB_6..."
          aws s3 cp .backups/glue_job_6_backup.py s3://$S3_BUCKET_6/$S3_KEY_6 || echo "[WARN] Could not restore backup for job 6"
          echo "[ROLLBACK 6] Restarting $GLUE_JOB_6 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_6 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 6 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 6"; fi

          echo "[ROLLBACK 7] Restoring old script for $GLUE_JOB_7..."
          aws s3 cp .backups/glue_job_7_backup.py s3://$S3_BUCKET_7/$S3_KEY_7 || echo "[WARN] Could not restore backup for job 7"
          echo "[ROLLBACK 7] Restarting $GLUE_JOB_7 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_7 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 7 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 7"; fi

          echo "[ROLLBACK 8] Restoring old script for $GLUE_JOB_8..."
          aws s3 cp .backups/glue_job_8_backup.py s3://$S3_BUCKET_8/$S3_KEY_8 || echo "[WARN] Could not restore backup for job 8"
          echo "[ROLLBACK 8] Restarting $GLUE_JOB_8 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_8 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 8 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 8"; fi

          echo "[ROLLBACK 9] Restoring old script for $GLUE_JOB_9..."
          aws s3 cp .backups/glue_job_9_backup.py s3://$S3_BUCKET_9/$S3_KEY_9 || echo "[WARN] Could not restore backup for job 9"
          echo "[ROLLBACK 9] Restarting $GLUE_JOB_9 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_9 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 9 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 9"; fi

          echo "[ROLLBACK 10] Restoring old script for $GLUE_JOB_10..."
          aws s3 cp .backups/glue_job_10_backup.py s3://$S3_BUCKET_10/$S3_KEY_10 || echo "[WARN] Could not restore backup for job 10"
          echo "[ROLLBACK 10] Restarting $GLUE_JOB_10 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_10 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 10 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 10"; fi

          echo "[ROLLBACK 11] Restoring old script for $GLUE_JOB_11..."
          aws s3 cp .backups/glue_job_11_backup.py s3://$S3_BUCKET_11/$S3_KEY_11 || echo "[WARN] Could not restore backup for job 11"
          echo "[ROLLBACK 11] Restarting $GLUE_JOB_11 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_11 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 11 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 11"; fi

          echo "[ROLLBACK 12] Restoring old script for $GLUE_JOB_12..."
          aws s3 cp .backups/glue_job_12_backup.py s3://$S3_BUCKET_12/$S3_KEY_12 || echo "[WARN] Could not restore backup for job 12"
          echo "[ROLLBACK 12] Restarting $GLUE_JOB_12 with old script..."
          NEW_RUN=$(aws glue start-job-run --job-name $GLUE_JOB_12 --query 'JobRunId' --output text 2>/dev/null || echo "ERROR")
          if [ "$NEW_RUN" != "ERROR" ]; then echo "[✓] Job 12 restarted with RUN_ID=$NEW_RUN"; else echo "[ERROR] Failed to restart job 12"; fi

          echo ""
          echo "✅ Rollback completed - old scripts restored and jobs restarted"
          echo "   → Monitor CloudWatch logs for execution status"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
