name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Previous successful commit SHA to restore on rollback (optional)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Set SHA
        run: echo "GIT_SHA=40a57b04cc5bfebc9f49f04e28e43e88bbe972ad" >> $GITHUB_ENV

      - name: Build dependencies
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build/
          cd build
          zip -r ../dependencies.zip .

      - name: Upload dependencies
        run: |
          aws s3 cp dependencies.zip s3://bucket/libs/dependencies-${GIT_SHA}.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Get Terraform outputs
        run: |
          echo "S3_BUCKET_1=$(terraform output -raw glue_test_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_1=$(terraform output -raw glue_test_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_1=$(terraform output -raw glue_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_2=$(terraform output -raw glue_second_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_2=$(terraform output -raw glue_second_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_2=$(terraform output -raw glue_second_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_3=$(terraform output -raw glue_third_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_3=$(terraform output -raw glue_third_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_3=$(terraform output -raw glue_third_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_4=$(terraform output -raw glue_fourth_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_4=$(terraform output -raw glue_fourth_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_4=$(terraform output -raw glue_fourth_job_name)" >> $GITHUB_ENV


      - name: Build S3 path
        run: |
          echo "S3_PATH_1=s3://$S3_BUCKET_1/$GIT_SHA/$S3_KEY_1" >> $GITHUB_ENV

          echo "S3_PATH_2=s3://$S3_BUCKET_2/$GIT_SHA/$S3_KEY_2" >> $GITHUB_ENV

          echo "S3_PATH_3=s3://$S3_BUCKET_3/$GIT_SHA/$S3_KEY_3" >> $GITHUB_ENV

          echo "S3_PATH_4=s3://$S3_BUCKET_4/$GIT_SHA/$S3_KEY_4" >> $GITHUB_ENV


      - name: Replace Glue script in S3
        run: |
          aws s3 cp frontend/src/jobs/etl_offers.py $S3_PATH_1
          aws s3 cp frontend/src/jobs/etl_sales.py $S3_PATH_2
          aws s3 cp frontend/src/jobs/glue_users.py $S3_PATH_3
          aws s3 cp frontend/src/jobs/peouo.py $S3_PATH_4

      # ─────────────────────────────
      # 10. Trigger Glue Jobs + capturer les Run IDs
      # FIX: on récupère les RUN_ID pour que le smoke test surveille
      #      ces runs précis, sans relancer les jobs une 2ème fois
      # ─────────────────────────────
      - name: Trigger Glue Jobs
        run: |
          RUN1=$(aws glue start-job-run --job-name "$GLUE_JOB_1" --query 'JobRunId' --output text)
          echo "RUN_ID_1=$RUN1" >> $GITHUB_ENV

          RUN2=$(aws glue start-job-run --job-name "$GLUE_JOB_2" --query 'JobRunId' --output text)
          echo "RUN_ID_2=$RUN2" >> $GITHUB_ENV

          RUN3=$(aws glue start-job-run --job-name "$GLUE_JOB_3" --query 'JobRunId' --output text)
          echo "RUN_ID_3=$RUN3" >> $GITHUB_ENV

          RUN4=$(aws glue start-job-run --job-name "$GLUE_JOB_4" --query 'JobRunId' --output text)
          echo "RUN_ID_4=$RUN4" >> $GITHUB_ENV

          echo "Jobs lancés : $RUN1 | $RUN2 | $RUN3 | $RUN4"

      # ─────────────────────────────
      # 11. SMOKE TEST
      # FIX 1: surveille les runs existants (RUN_ID) → plus de double lancement
      # FIX 2: polling en parallèle (background) → tous les jobs checkés en même temps
      # ─────────────────────────────
      - name: Smoke Test - Validate Glue Jobs
        run: |
          set -euo pipefail

          MAX_RETRIES=25
          SLEEP_TIME=20

          # Surveille un run déjà lancé (RUN_ID passé en argument)
          # FIX : prend JOB_NAME + RUN_ID existant, ne relance PAS le job
          watch_run() {
            local JOB_NAME=$1
            local RUN_ID=$2

            echo "▶ Watching [$JOB_NAME] run: $RUN_ID"

            local STATUS="STARTING"
            local COUNT=0

            while [[ "$STATUS" == "STARTING" || "$STATUS" == "RUNNING" ]]; do
              STATUS=$(aws glue get-job-run \
                --job-name "$JOB_NAME" \
                --run-id "$RUN_ID" \
                --query 'JobRun.JobRunState' \
                --output text)

              echo "  [$JOB_NAME] → $STATUS"

              COUNT=$((COUNT + 1))
              if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                echo "❌ TIMEOUT: $JOB_NAME ($RUN_ID)"
                return 1
              fi

              sleep "$SLEEP_TIME"
            done

            if [ "$STATUS" != "SUCCEEDED" ]; then
              echo "❌ FAILED: $JOB_NAME ($RUN_ID) — état final: $STATUS"
              return 1
            fi

            echo "✅ PASSED: $JOB_NAME"
            return 0
          }

          watch_run "$GLUE_JOB_1" "$RUN_ID_1" &
          watch_run "$GLUE_JOB_2" "$RUN_ID_2" &
          watch_run "$GLUE_JOB_3" "$RUN_ID_3" &
          watch_run "$GLUE_JOB_4" "$RUN_ID_4" &

          # Attendre tous les processus et échouer si l'un d'eux échoue
          FAILED=0
          for pid in $(jobs -p); do
            wait "$pid" || FAILED=1
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ Un ou plusieurs jobs Glue ont échoué."
            exit 1
          fi

          echo ""
          echo "✅ Tous les smoke tests sont passés."

      # ─────────────────────────────
      # 12. ROLLBACK MECHANISM (Best Practices)
      # FIX 1: Automatic rollback on smoke test failure
      # FIX 2: Restore from timestamped backup
      # FIX 3: Validate rollback + notify
      # ─────────────────────────────
      - name: Capture Previous Versions (Pre-Deployment)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p backups

          # Pour chaque job, récupérer la version actuelle avant le déploiement
          echo "[INFO] Backing up S3_BUCKET_1/$S3_KEY_1 → backups/backup_${{GIT_SHA}}_job1.py"
          aws s3 cp s3://$S3_BUCKET_1/$S3_KEY_1 backups/backup_${{GIT_SHA}}_job1.py || true
          echo "[INFO] Backing up S3_BUCKET_2/$S3_KEY_2 → backups/backup_${{GIT_SHA}}_job2.py"
          aws s3 cp s3://$S3_BUCKET_2/$S3_KEY_2 backups/backup_${{GIT_SHA}}_job2.py || true
          echo "[INFO] Backing up S3_BUCKET_3/$S3_KEY_3 → backups/backup_${{GIT_SHA}}_job3.py"
          aws s3 cp s3://$S3_BUCKET_3/$S3_KEY_3 backups/backup_${{GIT_SHA}}_job3.py || true
          echo "[INFO] Backing up S3_BUCKET_4/$S3_KEY_4 → backups/backup_${{GIT_SHA}}_job4.py"
          aws s3 cp s3://$S3_BUCKET_4/$S3_KEY_4 backups/backup_${{GIT_SHA}}_job4.py || true

          # Archiver les backups pour audit trail
          if [ -d backups ]; then
            zip -r backups-${GIT_SHA}.zip backups/
            aws s3 cp backups-${GIT_SHA}.zip s3://bucket/rollback-archives/backups-${GIT_SHA}.zip || true
            echo "[✓] Audit trail saved → s3://bucket/rollback-archives/backups-${GIT_SHA}.zip"
          fi

      - name: Automatic Rollback on Failure
        if: failure()
        run: |
          set -euo pipefail
          echo ""
          echo "🔴 SMOKE TEST FAILED - INITIATING ROLLBACK"
          echo ""

          PREVIOUS_SHA=$(aws s3 ls s3://bucket/glue-versions/ --recursive | grep -o '[a-f0-9]\{40\}' | tail -1 || echo '')"
          if [ -z "$PREVIOUS_SHA" ]; then
            echo "⚠️  No previous version found in s3://bucket/glue-versions/"
            echo "❌ ROLLBACK FAILED: Cannot restore without a previous version"
            exit 1
          fi

          echo "Restoring from previous version: $PREVIOUS_SHA"
          echo "  • Restoring S3_KEY_1 from $PREVIOUS_SHA..."
          aws s3 cp s3://$S3_BUCKET_1/$PREVIOUS_SHA/$S3_KEY_1 s3://$S3_BUCKET_1/$S3_KEY_1 || echo "⚠️  Warning: restore of job 1 incomplete"
          echo "  • Restoring S3_KEY_2 from $PREVIOUS_SHA..."
          aws s3 cp s3://$S3_BUCKET_2/$PREVIOUS_SHA/$S3_KEY_2 s3://$S3_BUCKET_2/$S3_KEY_2 || echo "⚠️  Warning: restore of job 2 incomplete"
          echo "  • Restoring S3_KEY_3 from $PREVIOUS_SHA..."
          aws s3 cp s3://$S3_BUCKET_3/$PREVIOUS_SHA/$S3_KEY_3 s3://$S3_BUCKET_3/$S3_KEY_3 || echo "⚠️  Warning: restore of job 3 incomplete"
          echo "  • Restoring S3_KEY_4 from $PREVIOUS_SHA..."
          aws s3 cp s3://$S3_BUCKET_4/$PREVIOUS_SHA/$S3_KEY_4 s3://$S3_BUCKET_4/$S3_KEY_4 || echo "⚠️  Warning: restore of job 4 incomplete"

          echo ""
          echo "✅ Rollback completed - manual validation required"
          echo "   → Check CloudWatch logs before restarting jobs"

      - name: Validate Rollback + Notify
        if: failure()
        run: |
          cat > /tmp/rollback_report.txt << 'EOF'
Deployment FAILED - Rollback Initiated
────────────────────────────────────────
Deployment SHA:  ${{ env.GIT_SHA }}
Previous SHA:    $PREVIOUS_SHA
Timestamp:       $(date -u +'%Y-%m-%d %H:%M:%S UTC')
Backup Location: s3://bucket/rollback-archives/backups-${{ env.GIT_SHA }}.zip

RECOMMENDED NEXT STEPS:
1. Review smoke test logs above
2. Check Glue job execution logs in CloudWatch
3. Identify root cause in the code
4. Update and re-deploy
5. Keep rollback archive for post-mortem analysis
EOF

          echo ""
          echo "📋 ROLLBACK REPORT:"
          cat /tmp/rollback_report.txt
