name: CD Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Set SHA
        run: echo "GIT_SHA=40a57b04cc5bfebc9f49f04e28e43e88bbe972ad" >> $GITHUB_ENV

      - name: Build dependencies
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build/
          cd build
          zip -r ../dependencies.zip .

      - name: Upload dependencies
        run: |
          aws s3 cp dependencies.zip s3://bucket/libs/dependencies-${GIT_SHA}.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Get Terraform outputs
        run: |
          echo "S3_BUCKET_1=$(terraform output -raw glue_test_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_1=$(terraform output -raw glue_test_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_1=$(terraform output -raw glue_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_2=$(terraform output -raw glue_second_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_2=$(terraform output -raw glue_second_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_2=$(terraform output -raw glue_second_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_3=$(terraform output -raw glue_third_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_3=$(terraform output -raw glue_third_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_3=$(terraform output -raw glue_third_job_name)" >> $GITHUB_ENV

          echo "S3_BUCKET_4=$(terraform output -raw glue_fourth_script_s3_bucket)" >> $GITHUB_ENV
          echo "S3_KEY_4=$(terraform output -raw glue_fourth_script_s3_key)" >> $GITHUB_ENV
          echo "GLUE_JOB_4=$(terraform output -raw glue_fourth_job_name)" >> $GITHUB_ENV


      - name: Build Release and Live paths
        run: |
          echo "RELEASE_KEY_1=releases/$GIT_SHA/$S3_KEY_1" >> $GITHUB_ENV
          echo "RELEASE_PATH_1=s3://$S3_BUCKET_1/$RELEASE_KEY_1" >> $GITHUB_ENV
          echo "LIVE_PATH_1=s3://$S3_BUCKET_1/$S3_KEY_1" >> $GITHUB_ENV
          echo "POINTER_KEY_1=metadata/glue/$GLUE_JOB_1/current_sha.txt" >> $GITHUB_ENV

          echo "RELEASE_KEY_2=releases/$GIT_SHA/$S3_KEY_2" >> $GITHUB_ENV
          echo "RELEASE_PATH_2=s3://$S3_BUCKET_2/$RELEASE_KEY_2" >> $GITHUB_ENV
          echo "LIVE_PATH_2=s3://$S3_BUCKET_2/$S3_KEY_2" >> $GITHUB_ENV
          echo "POINTER_KEY_2=metadata/glue/$GLUE_JOB_2/current_sha.txt" >> $GITHUB_ENV

          echo "RELEASE_KEY_3=releases/$GIT_SHA/$S3_KEY_3" >> $GITHUB_ENV
          echo "RELEASE_PATH_3=s3://$S3_BUCKET_3/$RELEASE_KEY_3" >> $GITHUB_ENV
          echo "LIVE_PATH_3=s3://$S3_BUCKET_3/$S3_KEY_3" >> $GITHUB_ENV
          echo "POINTER_KEY_3=metadata/glue/$GLUE_JOB_3/current_sha.txt" >> $GITHUB_ENV

          echo "RELEASE_KEY_4=releases/$GIT_SHA/$S3_KEY_4" >> $GITHUB_ENV
          echo "RELEASE_PATH_4=s3://$S3_BUCKET_4/$RELEASE_KEY_4" >> $GITHUB_ENV
          echo "LIVE_PATH_4=s3://$S3_BUCKET_4/$S3_KEY_4" >> $GITHUB_ENV
          echo "POINTER_KEY_4=metadata/glue/$GLUE_JOB_4/current_sha.txt" >> $GITHUB_ENV


      - name: Load Previous Release Pointers
        run: |
          set -euo pipefail
          PREV_SHA_1=$(aws s3 cp s3://$S3_BUCKET_1/$POINTER_KEY_1 - 2>/dev/null | tr -d '\r\n' || echo "None")
          if [ "$PREV_SHA_1" = "None" ] || [ -z "$PREV_SHA_1" ]; then
            echo "[WARN] No previous release pointer found for $GLUE_JOB_1"
          fi
          echo "PREV_SHA_1=$PREV_SHA_1" >> $GITHUB_ENV

          PREV_SHA_2=$(aws s3 cp s3://$S3_BUCKET_2/$POINTER_KEY_2 - 2>/dev/null | tr -d '\r\n' || echo "None")
          if [ "$PREV_SHA_2" = "None" ] || [ -z "$PREV_SHA_2" ]; then
            echo "[WARN] No previous release pointer found for $GLUE_JOB_2"
          fi
          echo "PREV_SHA_2=$PREV_SHA_2" >> $GITHUB_ENV

          PREV_SHA_3=$(aws s3 cp s3://$S3_BUCKET_3/$POINTER_KEY_3 - 2>/dev/null | tr -d '\r\n' || echo "None")
          if [ "$PREV_SHA_3" = "None" ] || [ -z "$PREV_SHA_3" ]; then
            echo "[WARN] No previous release pointer found for $GLUE_JOB_3"
          fi
          echo "PREV_SHA_3=$PREV_SHA_3" >> $GITHUB_ENV

          PREV_SHA_4=$(aws s3 cp s3://$S3_BUCKET_4/$POINTER_KEY_4 - 2>/dev/null | tr -d '\r\n' || echo "None")
          if [ "$PREV_SHA_4" = "None" ] || [ -z "$PREV_SHA_4" ]; then
            echo "[WARN] No previous release pointer found for $GLUE_JOB_4"
          fi
          echo "PREV_SHA_4=$PREV_SHA_4" >> $GITHUB_ENV


      - name: Upload scripts to release path
        run: |
          aws s3 cp frontend/src/jobs/etl_offers.py $RELEASE_PATH_1
          aws s3 cp frontend/src/jobs/etl_sales.py $RELEASE_PATH_2
          aws s3 cp frontend/src/jobs/glue_users.py $RELEASE_PATH_3
          aws s3 cp frontend/src/jobs/peouo.py $RELEASE_PATH_4

      - name: Promote release to live path
        run: |
          aws s3 cp $RELEASE_PATH_1 $LIVE_PATH_1
          aws s3 cp $RELEASE_PATH_2 $LIVE_PATH_2
          aws s3 cp $RELEASE_PATH_3 $LIVE_PATH_3
          aws s3 cp $RELEASE_PATH_4 $LIVE_PATH_4

      # ─────────────────────────────
      # 10. Trigger Glue Jobs + capturer les Run IDs
      # FIX: on récupère les RUN_ID pour que le smoke test surveille
      #      ces runs précis, sans relancer les jobs une 2ème fois
      # ─────────────────────────────
      - name: Trigger Glue Jobs
        run: |
          RUN1=$(aws glue start-job-run --job-name "$GLUE_JOB_1" --query 'JobRunId' --output text)
          echo "RUN_ID_1=$RUN1" >> $GITHUB_ENV

          RUN2=$(aws glue start-job-run --job-name "$GLUE_JOB_2" --query 'JobRunId' --output text)
          echo "RUN_ID_2=$RUN2" >> $GITHUB_ENV

          RUN3=$(aws glue start-job-run --job-name "$GLUE_JOB_3" --query 'JobRunId' --output text)
          echo "RUN_ID_3=$RUN3" >> $GITHUB_ENV

          RUN4=$(aws glue start-job-run --job-name "$GLUE_JOB_4" --query 'JobRunId' --output text)
          echo "RUN_ID_4=$RUN4" >> $GITHUB_ENV

          echo "Jobs lancés : $RUN1 | $RUN2 | $RUN3 | $RUN4"

      # ─────────────────────────────
      # 11. SMOKE TEST
      # FIX 1: surveille les runs existants (RUN_ID) → plus de double lancement
      # FIX 2: polling en parallèle (background) → tous les jobs checkés en même temps
      # ─────────────────────────────
      - name: Smoke Test - Validate Glue Jobs
        run: |
          set -euo pipefail

          MAX_RETRIES=25
          SLEEP_TIME=20

          # Surveille un run déjà lancé (RUN_ID passé en argument)
          # FIX : prend JOB_NAME + RUN_ID existant, ne relance PAS le job
          watch_run() {
            local JOB_NAME=$1
            local RUN_ID=$2

            echo "▶ Watching [$JOB_NAME] run: $RUN_ID"

            local STATUS="STARTING"
            local COUNT=0

            while [[ "$STATUS" == "STARTING" || "$STATUS" == "RUNNING" ]]; do
              STATUS=$(aws glue get-job-run \
                --job-name "$JOB_NAME" \
                --run-id "$RUN_ID" \
                --query 'JobRun.JobRunState' \
                --output text)

              echo "  [$JOB_NAME] → $STATUS"

              COUNT=$((COUNT + 1))
              if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                echo "❌ TIMEOUT: $JOB_NAME ($RUN_ID)"
                return 1
              fi

              sleep "$SLEEP_TIME"
            done

            if [ "$STATUS" != "SUCCEEDED" ]; then
              echo "❌ FAILED: $JOB_NAME ($RUN_ID) — état final: $STATUS"
              return 1
            fi

            echo "✅ PASSED: $JOB_NAME"
            return 0
          }

          watch_run "$GLUE_JOB_1" "$RUN_ID_1" &
          watch_run "$GLUE_JOB_2" "$RUN_ID_2" &
          watch_run "$GLUE_JOB_3" "$RUN_ID_3" &
          watch_run "$GLUE_JOB_4" "$RUN_ID_4" &

          # Attendre tous les processus et échouer si l'un d'eux échoue
          FAILED=0
          for pid in $(jobs -p); do
            wait "$pid" || FAILED=1
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ Un ou plusieurs jobs Glue ont échoué."
            exit 1
          fi

          echo ""
          echo "✅ Tous les smoke tests sont passés."

      # ─────────────────────────────
      # 12. ROLLBACK ON FAILURE
      # Restore previous release to live path when smoke test fails
      # ─────────────────────────────
      - name: Rollback - Restore Previous Release
        if: failure()
        run: |
          set -euo pipefail
          echo ""
          echo "🔴 SMOKE TEST FAILED - INITIATING ROLLBACK"
          echo ""
          if [ "${PREV_SHA_1:-None}" != "None" ] && [ -n "${PREV_SHA_1:-}" ]; then
            PREV_RELEASE_PATH_1=s3://$S3_BUCKET_1/releases/$PREV_SHA_1/$S3_KEY_1
            echo "[ROLLBACK 1] Restoring $GLUE_JOB_1 from $PREV_RELEASE_PATH_1"
            aws s3 cp $PREV_RELEASE_PATH_1 $LIVE_PATH_1
            aws glue start-job-run --job-name "$GLUE_JOB_1" --query 'JobRunId' --output text >/dev/null || true
          else
            echo "[WARN] No previous release pointer for $GLUE_JOB_1; skip rollback"
          fi

          if [ "${PREV_SHA_2:-None}" != "None" ] && [ -n "${PREV_SHA_2:-}" ]; then
            PREV_RELEASE_PATH_2=s3://$S3_BUCKET_2/releases/$PREV_SHA_2/$S3_KEY_2
            echo "[ROLLBACK 2] Restoring $GLUE_JOB_2 from $PREV_RELEASE_PATH_2"
            aws s3 cp $PREV_RELEASE_PATH_2 $LIVE_PATH_2
            aws glue start-job-run --job-name "$GLUE_JOB_2" --query 'JobRunId' --output text >/dev/null || true
          else
            echo "[WARN] No previous release pointer for $GLUE_JOB_2; skip rollback"
          fi

          if [ "${PREV_SHA_3:-None}" != "None" ] && [ -n "${PREV_SHA_3:-}" ]; then
            PREV_RELEASE_PATH_3=s3://$S3_BUCKET_3/releases/$PREV_SHA_3/$S3_KEY_3
            echo "[ROLLBACK 3] Restoring $GLUE_JOB_3 from $PREV_RELEASE_PATH_3"
            aws s3 cp $PREV_RELEASE_PATH_3 $LIVE_PATH_3
            aws glue start-job-run --job-name "$GLUE_JOB_3" --query 'JobRunId' --output text >/dev/null || true
          else
            echo "[WARN] No previous release pointer for $GLUE_JOB_3; skip rollback"
          fi

          if [ "${PREV_SHA_4:-None}" != "None" ] && [ -n "${PREV_SHA_4:-}" ]; then
            PREV_RELEASE_PATH_4=s3://$S3_BUCKET_4/releases/$PREV_SHA_4/$S3_KEY_4
            echo "[ROLLBACK 4] Restoring $GLUE_JOB_4 from $PREV_RELEASE_PATH_4"
            aws s3 cp $PREV_RELEASE_PATH_4 $LIVE_PATH_4
            aws glue start-job-run --job-name "$GLUE_JOB_4" --query 'JobRunId' --output text >/dev/null || true
          else
            echo "[WARN] No previous release pointer for $GLUE_JOB_4; skip rollback"
          fi

          echo "✅ Rollback completed"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Update release pointers
        if: success()
        run: |
          set -euo pipefail
          printf '%s' "$GIT_SHA" | aws s3 cp - s3://$S3_BUCKET_1/$POINTER_KEY_1
          printf '%s' "$GIT_SHA" | aws s3 cp - s3://$S3_BUCKET_2/$POINTER_KEY_2
          printf '%s' "$GIT_SHA" | aws s3 cp - s3://$S3_BUCKET_3/$POINTER_KEY_3
          printf '%s' "$GIT_SHA" | aws s3 cp - s3://$S3_BUCKET_4/$POINTER_KEY_4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
