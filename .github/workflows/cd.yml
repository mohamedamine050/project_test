name: CD Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Set SHA
        run: echo "GIT_SHA=${{ github.sha }}" >> $GITHUB_ENV



      - name: Build dependencies
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build/
          cd build
          zip -r ../dependencies.zip .

      - name: Upload dependencies
        run: |
          aws s3 cp dependencies.zip s3://bucket/libs/dependencies-${GIT_SHA}.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Get Terraform outputs
        run: |
          echo "S3_BUCKET=$(terraform output -raw scripts_bucket_name)" >> $GITHUB_ENV
          echo "S3_KEY=$(terraform output -raw glue_test_script_s3_key)" >> $GITHUB_ENV

      - name: Build S3 path
        run: |
          echo "S3_PATH=s3://$S3_BUCKET/$S3_KEY" >> $GITHUB_ENV

      - name: Replace Glue script in S3
        run: |
          aws s3 cp frontend/src/jobs/etl_offers.py $S3_PATH
